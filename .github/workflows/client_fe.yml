name: client_fe
on:
  push:
    branches: [main]
jobs: 
  build_and_push: 
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Docker login
        uses: docker/login-action@v3
        with: 
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile/Dockerfile.client_fe
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/draw-app-client:${{ github.sha }},${{ env.DOCKERHUB_USERNAME }}/draw-app-client:latest
      
        


