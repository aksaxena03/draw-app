name: ws_server
on:
  push:
    branches: [main]
jobs: 
  build_push_deploy: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Docker login
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile/Dockerfile.ws
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/draw-app-ws:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/draw-app-ws:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Deploy to EC2
        env:
          SSH_HOST: ubuntu@34.207.185.175
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/draw-app-ws:${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key $SSH_HOST "
            docker pull $IMAGE &&
            docker stop ws-server || true &&
            docker rm ws-server || true &&
            docker run -d --name ws-server --restart unless-stopped \
              -e DATABASE_URL=$DATABASE_URL \
              -p 8080:8080 $IMAGE
          "