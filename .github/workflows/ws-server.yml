name: http_server
on:
  push:
    branches: [main]
jobs: 
  deploy: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Docker login
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile/Dockerfile.ws-server
          push: true
          tags: aksaxena03/draw-app:${{github.sha}}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Deploy to VM
        env:
          SSH_HOST: ubuntu@34.207.185.175
          CONTAINER_NAME: ws-server
          CONTAINER_PORT: 3000
        run: |
         echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@34.207.185.175 "
          docker pull aksaxena03/draw-app:${{github.sha}} &&
          docker stop http-server || true &&
          docker rm http-server || true &&
          docker run -d --name http-server -p 3000:3000 aksaxena03/draw-app:${{github.sha}}
          "