name: ws_server
on:
  push:
    branches: [main]
jobs: 
  build_push_deploy: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Docker login
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile/Dockerfile.ws
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/draw-app-ws:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/draw-app-ws:latest
          build-args: |
            DATABASE_URL=${{ DATABASE_URL }}
