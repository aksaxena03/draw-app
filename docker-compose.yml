version: '3.8'

networks:
  app_net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=draw_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    ports:
      - "5432:5432"

  http-server:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.http-server
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3004
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "3004:3004"

  ws-server:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.ws
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PORT=8080
      - HEALTH_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "8080:8080"

  client_fe:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.client_fe
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_HTTP_URL=http://http-server:3004
      - NEXT_PUBLIC_WS_URL=ws://ws-server:8080
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      http-server:
        condition: service_started
      ws-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "3000:3000"

volumes:
  postgres_data:
